<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>واژه‌نامه‌ی من — نسخهٔ نهایی</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg: #0b1021;
      --card: #121a33;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --primary: #fbbf24;     /* طلایی */
      --primary-2: #d1d5db;   /* نقره‌ای */
      --border: #1f2937;
      --shadow: 0 10px 25px rgba(0,0,0,0.35);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Tahoma, Arial, sans-serif;
      background: radial-gradient(120deg, #0b1021 0%, #0f1736 100%);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
    }
    .container {
      max-width: 720px;
      margin: 24px auto;
      padding: 0 16px;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 20px;
      margin: 0;
      color: #f3f4f6;
    }
    .card {
      background: linear-gradient(180deg, #121a33 0%, #0f162b 100%);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
    }
    .row {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    input, textarea, button {
      font-size: 14px;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #0b1226;
      color: var(--text);
    }
    input::placeholder, textarea::placeholder {
      color: #6b7280;
    }
    input, textarea { width: 100%; }
    textarea { min-height: 80px; resize: vertical; }
    button {
      background: linear-gradient(180deg, #fbbf24 0%, #b45309 100%);
      color: #111827;
      border: none;
      cursor: pointer;
      font-weight: 600;
    }
    button.secondary {
      background: linear-gradient(180deg, #d1d5db 0%, #6b7280 100%);
      color: #111827;
    }
    button.danger {
      background: linear-gradient(180deg, #f87171 0%, #b91c1c 100%);
    }
    .muted { color: var(--muted); font-size: 13px; }
    .entry {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }
    .entry:last-child { border-bottom: none; }
    .entry-actions {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .hidden { display: none !important; }
    .status {
      font-size: 13px;
      padding: 6px 8px;
      border-radius: 6px;
      margin-top: 8px;
      white-space: pre-wrap;
    }
    .status.ok { background: #064e3b; color: #a7f3d0; border: 1px solid #059669; }
    .status.err { background: #7f1d1d; color: #fecaca; border: 1px solid #dc2626; }

    /* جست‌وجو */
    .search-box {
      margin: 12px 0 4px 0;
    }
    .search-input {
      width: 100%;
      padding: 10px 12px;
      font-size: 15px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #0b1226;
      color: var(--text);
    }
    .sort-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .sort-btn {
      padding: 6px 10px;
      font-size: 13px;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>واژه‌نامه‌ی من</h1>
      <div id="authBar" class="row">
        <span id="userEmail" class="muted"></span>
        <button id="btnLogout" class="secondary">خروج</button>
      </div>
    </header>

    <!-- فرم ورود -->
    <section id="loginCard" class="card">
      <h2 style="margin:0 0 8px 0; font-size:16px;">ورود</h2>
      <div class="row" style="flex-direction:column; gap:8px;">
        <input id="email" type="email" placeholder="ایمیل" />
        <input id="password" type="password" placeholder="رمز" />
        <button id="btnLogin">ورود</button>
        <div id="loginStatus" class="status hidden"></div>
      </div>
    </section>

    <!-- بخش واژه‌نامه -->
    <section id="appCard" class="card hidden">
      <h2 style="margin:0 0 8px 0; font-size:16px;">افزودن واژه</h2>
      <div class="row" style="flex-direction:column; gap:8px;">
        <input id="term" placeholder="واژه" />
        <textarea id="definition" placeholder="معنی / توضیح"></textarea>
        <button id="btnAdd">افزودن</button>
        <div id="appStatus" class="status hidden"></div>
      </div>

      <div class="sort-row">
        <h2 style="margin:16px 0 8px 0; font-size:16px;">واژه‌های من</h2>
        <button id="btnSort" class="secondary sort-btn">مرتب‌سازی الفبایی</button>
      </div>

      <!-- جست‌وجو -->
      <div class="search-box">
        <input id="searchInput" class="search-input" type="text" placeholder="جست‌وجو در واژه و معنی…" />
      </div>

      <div id="entriesList"></div>
    </section>
  </div>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm"></script>
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const SUPABASE_URL = "https://bmuwpcqqgxvoghxkaqch.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJtdXdwY3FxZ3h2b2doeGthcWNoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyNDczMzYsImV4cCI6MjEwMjgyMzMzNn0.N-XChiNbcBu3TgdF5S4snZlnyW45RegaAknG2J5EFfM";

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const loginCard = document.getElementById("loginCard");
    const appCard = document.getElementById("appCard");
    const authBar = document.getElementById("authBar");
    const userEmail = document.getElementById("userEmail");
    const btnLogout = document.getElementById("btnLogout");

    const emailIn = document.getElementById("email");
    const passIn = document.getElementById("password");
    const btnLogin = document.getElementById("btnLogin");
    const loginStatus = document.getElementById("loginStatus");

    const termIn = document.getElementById("term");
    const defIn = document.getElementById("definition");
    const btnAdd = document.getElementById("btnAdd");
    const appStatus = document.getElementById("appStatus");
    const entriesList = document.getElementById("entriesList");
    const searchInput = document.getElementById("searchInput");
    const btnSort = document.getElementById("btnSort");

    let currentUser = null;
    let allEntries = [];          // همهٔ واژه‌ها
    let sortedAsc = true;         // وضعیت مرتب‌سازی

    function showStatus(el, msg, ok) {
      el.textContent = msg;
      el.classList.remove("ok", "err", "hidden");
      el.classList.add(ok ? "ok" : "err");
      setTimeout(() => el.classList.add("hidden"), 8000);
    }

    async function refreshSession() {
      try {
        const { data: { session }, error } = await supabase.auth.getSession();
        if (error || !session) {
          showLogin();
          return;
        }
        currentUser = session.user;
        showApp();
        loadEntries();
      } catch {
        showLogin();
      }
    }

    function showLogin() {
      loginCard.classList.remove("hidden");
      appCard.classList.add("hidden");
      authBar.classList.add("hidden");
      currentUser = null;
    }

    function showApp() {
      loginCard.classList.add("hidden");
      appCard.classList.remove("hidden");
      authBar.classList.remove("hidden");
      userEmail.textContent = currentUser?.email || "";
    }

    btnLogin.addEventListener("click", async () => {
      loginStatus.classList.add("hidden");
      const email = emailIn.value.trim();
      const password = passIn.value;
      if (!email || !password) {
        showStatus(loginStatus, "ایمیل و رمز را وارد کن.", false);
        return;
      }
      try {
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });
        if (error || !data?.user) {
          showStatus(loginStatus, "ورود ناموفق:\n" + (error?.message || "خطای ناشناخته"), false);
          return;
        }
        currentUser = data.user;
        showApp();
        loadEntries();
      } catch (e) {
        showStatus(loginStatus, "خطا در ورود:\n" + (e?.message || "خطای ناشناخته"), false);
      }
    });

    btnLogout.addEventListener("click", async () => {
      await supabase.auth.signOut();
      showLogin();
      entriesList.innerHTML = "";
      allEntries = [];
    });

    async function loadEntries() {
      if (!currentUser) return;
      const { data, error } = await supabase
        .from("entries")
        .select("*")
        .eq("user_id", currentUser.id)
        .order("created_at", { ascending: false });

      if (error) {
        showStatus(appStatus, "خطا در بارگذاری:\n" + error.message, false);
        return;
      }
      allEntries = data || [];
      renderEntries(allEntries);
    }

    function renderEntries(rows) {
      entriesList.innerHTML = "";
      if (!rows.length) {
        const empty = document.createElement("div");
        empty.className = "muted";
        empty.textContent = "هنوز واژه‌ای اضافه نکرده‌ای.";
        entriesList.appendChild(empty);
        return;
      }
      rows.forEach(r => {
        const wrap = document.createElement("div");
        wrap.className = "entry";

        const text = document.createElement("div");
        const title = document.createElement("strong");
        title.textContent = r.term || "(بدون عنوان)";
        const desc = document.createElement("div");
        desc.className = "muted";
        desc.textContent = r.definition || "";
        text.appendChild(title);
        text.appendChild(desc);

        const actions = document.createElement("div");
        actions.className = "entry-actions";

        const btnEdit = document.createElement("button");
        btnEdit.className = "secondary";
        btnEdit.textContent = "ویرایش";
        btnEdit.addEventListener("click", () => startEdit(r));

        const btnDel = document.createElement("button");
        btnDel.className = "danger";
        btnDel.textContent = "حذف";
        btnDel.addEventListener("click", () => deleteEntry(r.id));

        actions.appendChild(btnEdit);
        actions.appendChild(btnDel);

        wrap.appendChild(text);
        wrap.appendChild(actions);
        entriesList.appendChild(wrap);
      });
    }

    // فیلتر بر اساس جست‌وجو
    searchInput.addEventListener("input", () => {
      const q = searchInput.value.trim().toLowerCase();
      if (!q) {
        renderEntries(allEntries);
        return;
      }
      const filtered = allEntries.filter(r => {
        const term = (r.term || "").toLowerCase();
        const def = (r.definition || "").toLowerCase();
        return term.includes(q) || def.includes(q);
      });
      renderEntries(filtered);
    });

    // مرتب‌سازی الفبایی
    btnSort.addEventListener("click", () => {
      sortedAsc = !sortedAsc;
      const sorted = [...allEntries].sort((a, b) => {
        const ta = (a.term || "").localeCompare("fa");
        const tb = (b.term || "").localeCompare("fa");
        return sortedAsc ? ta - tb : tb - ta;
      });
      renderEntries(sorted);
    });

    async function addEntry() {
      if (!currentUser) return;
      const term = termIn.value.trim();
      const definition = defIn.value.trim();
      if (!term && !definition) {
        showStatus(appStatus, "حداقل یکی از فیلدها را پر کن.", false);
        return;
      }
      const { error } = await supabase.from("entries").insert({
        user_id: currentUser.id,
        term,
        definition
      });
      if (error) {
        showStatus(appStatus, "خطا در افزودن:\n" + error.message, false);
        return;
      }
      termIn.value = "";
      defIn.value = "";
      showStatus(appStatus, "واژه اضافه شد.", true);
      loadEntries();
    }

    function startEdit(row) {
      const newTerm = prompt("ویرایش واژه:", row.term || "");
      if (newTerm === null) return;
      const newDef = prompt("ویرایش معنی:", row.definition || "");
      if (newDef === null) return;

      supabase.from("entries").update({ term: newTerm, definition: newDef }).eq("id", row.id).then(({ error }) => {
        if (error) {
          showStatus(appStatus, "خطا در ویرایش:\n" + error.message, false);
          return;
        }
        showStatus(appStatus, "ویرایش شد.", true);
        loadEntries();
      });
    }

    async function deleteEntry(id) {
      if (!confirm("آیا مطمئنی؟")) return;
      const { error } = await supabase.from("entries").delete().eq("id", id);
      if (error) {
        showStatus(appStatus, "خطا در حذف:\n" + error.message, false);
        return;
      }
      showStatus(appStatus, "حذف شد.", true);
      loadEntries();
    }

    btnAdd.addEventListener("click", addEntry);

    refreshSession();
  </script>
</body>
</html>
