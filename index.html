<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1021" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="واژه‌نامه" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <title>واژه‌نامه‌ی تخصصی با IPA</title>

  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png" />

  <style>
    :root {
      --bg: #0b1021;
      --bg-2: #111b3d;
      --text: #f4f6fc;
      --muted: #aab5cf;
      --gold-1: #ffe07a;
      --gold-2: #c58a14;
      --silver-1: #f0f3fa;
      --silver-2: #9aa4ba;
      --red-1: #fb7185;
      --red-2: #9f1730;
      --green: #b8f5d2;
      --border: #35456f;
      --border-soft: rgba(91, 113, 168, 0.42);
      --shadow: 0 14px 34px rgba(0, 0, 0, 0.36);
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--bg);
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(circle at 8% 0%, #1d3265 0%, transparent 32%),
        radial-gradient(circle at 92% 94%, #1b315d 0%, transparent 34%),
        linear-gradient(145deg, var(--bg) 0%, var(--bg-2) 100%);
      font-family: Tahoma, Arial, system-ui, -apple-system, "Segoe UI", sans-serif;
      line-height: 1.6;
    }

    .container {
      width: min(820px, 100%);
      margin: 0 auto;
      padding: 22px 16px calc(36px + env(safe-area-inset-bottom));
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 6px 2px 17px;
    }

    h1 {
      margin: 0;
      color: var(--gold-1);
      font-size: clamp(20px, 5vw, 25px);
      text-shadow: 0 1px 14px rgba(255, 224, 122, 0.25);
    }

    h2 {
      margin: 0 0 12px;
      color: var(--gold-1);
      font-size: 17px;
    }

    h3 {
      margin: 0 0 9px;
      color: #dbe6ff;
      font-size: 14px;
    }

    .card {
      margin-bottom: 16px;
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: 19px;
      background:
        linear-gradient(160deg, rgba(22, 35, 71, 0.97), rgba(8, 15, 33, 0.98));
      box-shadow: var(--shadow);
    }

    .row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .column {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .hidden {
      display: none !important;
    }

    .muted {
      color: var(--muted);
      font-size: 13px;
    }

    input,
    select,
    textarea,
    button {
      width: 100%;
      border-radius: 12px;
      font: inherit;
      font-size: 15px;
    }

    input,
    select,
    textarea {
      border: 1px solid #3b4c78;
      padding: 11px 12px;
      color: var(--text);
      outline: none;
      background: #081127;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--gold-1);
      box-shadow: 0 0 0 3px rgba(255, 224, 122, 0.14);
    }

    input::placeholder,
    textarea::placeholder {
      color: #8795b5;
    }

    textarea {
      min-height: 96px;
      resize: vertical;
    }

    button {
      border: 0;
      padding: 11px 13px;
      color: #121521;
      font-weight: 700;
      cursor: pointer;
      background: linear-gradient(180deg, var(--gold-1), var(--gold-2));
      box-shadow: 0 4px 13px rgba(197, 138, 20, 0.25);
    }

    button:active {
      transform: translateY(1px);
    }

    button:disabled {
      cursor: wait;
      opacity: 0.68;
    }

    button.secondary {
      color: #172033;
      background: linear-gradient(180deg, var(--silver-1), var(--silver-2));
      box-shadow: 0 4px 13px rgba(154, 164, 186, 0.18);
    }

    button.danger {
      color: #fff;
      background: linear-gradient(180deg, var(--red-1), var(--red-2));
      box-shadow: 0 4px 13px rgba(159, 23, 48, 0.24);
    }

    .small-button {
      width: auto;
      padding: 7px 10px;
      font-size: 13px;
    }

    .filters-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .status {
      margin-top: 11px;
      padding: 10px 11px;
      border-radius: 11px;
      white-space: pre-wrap;
      font-size: 13px;
    }

    .status.ok {
      color: var(--green);
      border: 1px solid #16845b;
      background: #073a2b;
    }

    .status.err {
      color: #ffd3d9;
      border: 1px solid #b63b51;
      background: #541826;
    }

    .lookup-panel {
      margin-top: 12px;
      padding: 13px;
      border: 1px solid var(--border-soft);
      border-radius: 14px;
      background: rgba(4, 11, 28, 0.45);
    }

    .lookup-summary {
      margin: 0;
      color: #d7e2fb;
      font-size: 13px;
      white-space: pre-wrap;
    }

    .lookup-data {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      margin-top: 11px;
    }

    .lookup-item {
      padding: 10px;
      border: 1px solid rgba(84, 105, 157, 0.55);
      border-radius: 10px;
      background: rgba(13, 25, 54, 0.72);
    }

    .lookup-label {
      display: block;
      margin-bottom: 3px;
      color: #c0ccea;
      font-size: 12px;
    }

    .lookup-value {
      color: #f5f7fb;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .ipa-display {
      direction: ltr;
      text-align: left;
      font-family: "Courier New", Courier, monospace;
      font-size: 16px;
    }

    .resource-title {
      margin-top: 14px;
      color: #d8e4ff;
      font-size: 14px;
      font-weight: 700;
    }

    .resources {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 8px;
      margin-top: 9px;
    }

    .resource-link {
      display: block;
      min-height: 96px;
      padding: 10px;
      color: inherit;
      text-decoration: none;
      border: 1px solid #3a4d7e;
      border-radius: 12px;
      background: #0b1733;
    }

    .resource-link:hover {
      border-color: var(--gold-1);
      background: #101e42;
    }

    .resource-rank {
      color: var(--gold-1);
      font-size: 12px;
    }

    .resource-name {
      margin-top: 2px;
      color: #f0f4ff;
      font-size: 13px;
      font-weight: 700;
    }

    .resource-note {
      margin-top: 4px;
      color: #aebbd6;
      font-size: 11px;
      line-height: 1.45;
    }

    .list-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 9px;
      margin-top: 23px;
    }

    .search-input {
      margin: 6px 0 10px;
    }

    .entry {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      padding: 14px 0;
      border-bottom: 1px solid rgba(61, 79, 126, 0.72);
    }

    .entry:last-child {
      border-bottom: 0;
    }

    .term-row {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
    }

    .term {
      color: #fff1bd;
      font-size: 16px;
      overflow-wrap: anywhere;
    }

    .ipa-badge {
      padding: 2px 7px;
      direction: ltr;
      border: 1px solid #5a427b;
      border-radius: 7px;
      color: #f0d7e6;
      background: #1a1038;
      font-family: "Courier New", Courier, monospace;
      font-size: 11px;
    }

    .definition {
      margin-top: 4px;
      color: var(--muted);
      overflow-wrap: anywhere;
    }

    .source {
      margin-top: 4px;
      color: #a6b9e2;
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .entry-actions {
      display: flex;
      align-items: flex-start;
    }

    .empty {
      padding: 18px 0 5px;
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 530px) {
      .container {
        padding-inline: 12px;
      }

      .card {
        padding: 15px;
        border-radius: 16px;
      }

      .filters-row {
        grid-template-columns: 1fr;
      }

      .entry {
        grid-template-columns: 1fr;
      }

      .entry-actions {
        justify-content: flex-start;
      }

      .resources {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <header>
      <h1>واژه‌نامه‌ی تخصصی</h1>

      <div id="authBar" class="row hidden">
        <span id="userEmail" class="muted"></span>

        <button id="btnLogout" class="secondary small-button" type="button">
          خروج
        </button>
      </div>
    </header>

    <section id="loginCard" class="card">
      <h2>ورود به واژه‌نامه</h2>

      <div class="column">
        <input
          id="email"
          type="email"
          inputmode="email"
          autocomplete="email"
          placeholder="ایمیل مشترک"
        />

        <input
          id="password"
          type="password"
          autocomplete="current-password"
          placeholder="رمز عبور"
        />

        <button id="btnLogin" type="button">ورود</button>
      </div>

      <div id="loginStatus" class="status hidden"></div>
    </section>

    <section id="appCard" class="card hidden">
      <h2>افزودن واژه</h2>

      <div class="column">
        <input
          id="wordOriginal"
          type="text"
          autocomplete="off"
          placeholder="واژه یا صورت اصلی واژه"
        />

        <input
          id="ipa"
          type="text"
          dir="ltr"
          autocomplete="off"
          placeholder="تلفظ IPA (اختیاری)"
        />

        <input
          id="persianEquivalent"
          type="text"
          autocomplete="off"
          placeholder="معادل فارسی / سره (اختیاری)"
        />

        <textarea
          id="meaningOriginal"
          placeholder="معنی یا توضیح (اختیاری)"
        ></textarea>

        <input
          id="pronunciationSource"
          type="text"
          autocomplete="off"
          placeholder="منبع تلفظ و معنی (اختیاری)"
        />

        <div class="filters-row">
          <select id="languageId" aria-label="زبان جست‌وجوی واژه">
            <option value="fa">فارسی (fa)</option>
            <option value="en">انگلیسی (en)</option>
            <option value="de">آلمانی (de)</option>
            <option value="fr">فرانسوی (fr)</option>
            <option value="tr">ترکی (tr)</option>
            <option value="ar">عربی (ar)</option>
            <option value="he">عبری (he)</option>
            <option value="el">یونانی باستان (el)</option>
            <option value="la">لاتین (la)</option>
            <option value="akk">اکدی (akk)</option>
            <option value="sux">سومری (sux)</option>
            <option value="av">اوستایی (av)</option>
            <option value="syr">سریانی (syr)</option>
            <option value="arc">آرامی (arc)</option>
            <option value="pal">پهلوی (pal)</option>
            <option value="peo">فارسی باستان (peo)</option>
          </select>

          <select id="filterLanguageId" aria-label="فیلتر زبان">
            <option value="">فیلتر زبان فعلاً غیرفعال است</option>
          </select>
        </div>

        <button id="btnFetchAuto" class="secondary" type="button">
          دریافت IPA و اطلاعات از منابع
        </button>

        <button id="btnAdd" type="button">افزودن واژه</button>
      </div>

      <div id="appStatus" class="status hidden"></div>

      <section id="lookupPanel" class="lookup-panel hidden">
        <h3>نتیجه‌ی جست‌وجوی منابع</h3>
        <p id="lookupSummary" class="lookup-summary"></p>
        <div id="lookupData" class="lookup-data"></div>

        <div id="resourceTitle" class="resource-title hidden">
          منابع پژوهشی و لینک جست‌وجوی واژه
        </div>

        <div id="resourcesList" class="resources"></div>
      </section>

      <div class="list-heading">
        <h2 style="margin: 0">واژه‌ها</h2>

        <button id="btnSort" class="secondary small-button" type="button">
          مرتب‌سازی الفبایی
        </button>
      </div>

      <input
        id="searchInput"
        class="search-input"
        type="search"
        autocomplete="off"
        placeholder="جست‌وجو در واژه، IPA، معنی، معادل فارسی و منبع…"
      />

      <div id="entriesList"></div>
    </section>
  </main>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const SUPABASE_URL = "https://bmuwpcqqgxvoghxkaqch.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_5W4VpuveGHPG7ZJ9gyenAw_DfhWjqpU";

    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const loginCard = document.getElementById("loginCard");
    const appCard = document.getElementById("appCard");
    const authBar = document.getElementById("authBar");
    const userEmail = document.getElementById("userEmail");

    const emailIn = document.getElementById("email");
    const passwordIn = document.getElementById("password");
    const btnLogin = document.getElementById("btnLogin");
    const btnLogout = document.getElementById("btnLogout");
    const loginStatus = document.getElementById("loginStatus");

    const wordOriginalIn = document.getElementById("wordOriginal");
    const ipaIn = document.getElementById("ipa");
    const persianEquivalentIn = document.getElementById("persianEquivalent");
    const meaningOriginalIn = document.getElementById("meaningOriginal");
    const pronunciationSourceIn = document.getElementById("pronunciationSource");
    const languageIdIn = document.getElementById("languageId");

    const btnFetchAuto = document.getElementById("btnFetchAuto");
    const btnAdd = document.getElementById("btnAdd");
    const appStatus = document.getElementById("appStatus");

    const lookupPanel = document.getElementById("lookupPanel");
    const lookupSummary = document.getElementById("lookupSummary");
    const lookupData = document.getElementById("lookupData");
    const resourceTitle = document.getElementById("resourceTitle");
    const resourcesList = document.getElementById("resourcesList");

    const searchInput = document.getElementById("searchInput");
    const btnSort = document.getElementById("btnSort");
    const entriesList = document.getElementById("entriesList");

    let currentUser = null;
    let allEntries = [];
    let alphabetical = false;

    function showStatus(element, message, isOk) {
      element.textContent = message;
      element.className = "status " + (isOk ? "ok" : "err");
      element.classList.remove("hidden");

      window.clearTimeout(element._hideTimer);

      element._hideTimer = window.setTimeout(() => {
        element.classList.add("hidden");
      }, 9000);
    }

    function clearStatus(element) {
      window.clearTimeout(element._hideTimer);
      element.classList.add("hidden");
      element.textContent = "";
    }

    function setButtonLoading(button, loadingText) {
      const oldText = button.textContent;
      button.disabled = true;
      button.textContent = loadingText;

      return () => {
        button.disabled = false;
        button.textContent = oldText;
      };
    }

    function clearLookupPanel() {
      lookupPanel.classList.add("hidden");
      lookupSummary.textContent = "";
      lookupData.innerHTML = "";
      resourcesList.innerHTML = "";
      resourceTitle.classList.add("hidden");
    }

    function showLogin() {
      currentUser = null;
      loginCard.classList.remove("hidden");
      appCard.classList.add("hidden");
      authBar.classList.add("hidden");
      clearLookupPanel();
    }

    function showApp() {
      loginCard.classList.add("hidden");
      appCard.classList.remove("hidden");
      authBar.classList.remove("hidden");
      userEmail.textContent = currentUser?.email || "";
    }

    function addLookupItem(label, value, ipa = false) {
      if (!value) return;

      const box = document.createElement("div");
      box.className = "lookup-item";

      const labelEl = document.createElement("span");
      labelEl.className = "lookup-label";
      labelEl.textContent = label;

      const valueEl = document.createElement("div");
      valueEl.className = "lookup-value" + (ipa ? " ipa-display" : "");
      valueEl.textContent = value;

      box.appendChild(labelEl);
      box.appendChild(valueEl);
      lookupData.appendChild(box);
    }

    function renderResources(resources) {
      resourcesList.innerHTML = "";

      if (!Array.isArray(resources) || !resources.length) {
        resourceTitle.classList.add("hidden");
        return;
      }

      resourceTitle.classList.remove("hidden");

      for (const resource of resources) {
        const link = document.createElement("a");
        link.className = "resource-link";
        link.href = resource.url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";

        const rank = document.createElement("div");
        rank.className = "resource-rank";
        rank.textContent = "اولویت " + String(resource.rank || "—");

        const name = document.createElement("div");
        name.className = "resource-name";
        name.textContent = resource.name || "منبع پژوهشی";

        const note = document.createElement("div");
        note.className = "resource-note";
        note.textContent = resource.note || resource.category || "";

        link.appendChild(rank);
        link.appendChild(name);
        link.appendChild(note);

        resourcesList.appendChild(link);
      }
    }

    function renderLookupResult(data) {
      lookupPanel.classList.remove("hidden");
      lookupData.innerHTML = "";

      const languageName = data?.language_name
        ? "زبان: " + data.language_name + "\n"
        : "";

      lookupSummary.textContent =
        languageName +
        (data?.message || "نتیجه‌ی جست‌وجو آماده است.");

      if (data?.ipa) {
        addLookupItem("IPA انتخاب‌شده", data.ipa, true);
      }

      if (
        Array.isArray(data?.ipa_candidates) &&
        data.ipa_candidates.length > 1
      ) {
        addLookupItem(
          "گزینه‌های دیگر IPA",
          data.ipa_candidates.join(" / "),
          true
        );
      }

      if (data?.meaning) {
        addLookupItem("معنی یا تعریف", data.meaning);
      }

      if (data?.etymology) {
        addLookupItem("ریشه‌شناسی", data.etymology);
      }

      if (data?.audio_url) {
        const audioBox = document.createElement("div");
        audioBox.className = "lookup-item";

        const audioLabel = document.createElement("span");
        audioLabel.className = "lookup-label";
        audioLabel.textContent = "فایل صوتی";

        const audio = document.createElement("audio");
        audio.controls = true;
        audio.preload = "none";
        audio.src = data.audio_url;

        audioBox.appendChild(audioLabel);
        audioBox.appendChild(audio);
        lookupData.appendChild(audioBox);
      }

      if (data?.source) {
        addLookupItem("منبع داده", data.source);
      }

      renderResources(data?.resources || []);
    }

    async function refreshSession() {
      try {
        const { data, error } = await supabase.auth.getSession();

        if (error || !data?.session) {
          showLogin();
          return;
        }

        currentUser = data.session.user;
        showApp();
        await loadEntries();
      } catch (error) {
        console.error("Session error:", error);
        showLogin();
      }
    }

    async function loadEntries() {
      if (!currentUser) return;

      const { data, error } = await supabase
        .from("word_entries")
        .select("*")
        .eq("user_id", currentUser.id)
        .order("created_at", { ascending: false });

      if (error) {
        showStatus(
          appStatus,
          "خطا در بارگذاری واژه‌ها:\n" + error.message,
          false
        );
        return;
      }

      allEntries = data || [];
      renderEntries();
    }

    function renderEntries() {
      const query = (searchInput.value || "")
        .trim()
        .toLocaleLowerCase();

      let rows = [...allEntries];

      if (query) {
        rows = rows.filter((entry) => {
          const fields = [
            entry.word_original,
            entry.ipa,
            entry.persian_sereh_equivalent,
            entry.meaning_original,
            entry.pronunciation_source,
          ];

          return fields.some((field) =>
            String(field || "").toLocaleLowerCase().includes(query)
          );
        });
      }

      if (alphabetical) {
        rows.sort((a, b) =>
          String(a.word_original || "").localeCompare(
            String(b.word_original || ""),
            "fa"
          )
        );
      }

      entriesList.innerHTML = "";

      if (!rows.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = query
          ? "هیچ واژه‌ای با این جست‌وجو یافت نشد."
          : "هنوز واژه‌ای اضافه نکرده‌اید.";

        entriesList.appendChild(empty);
        return;
      }

      for (const entry of rows) {
        const row = document.createElement("article");
        row.className = "entry";

        const textCol = document.createElement("div");

        const termRow = document.createElement("div");
        termRow.className = "term-row";

        const term = document.createElement("div");
        term.className = "term";
        term.textContent = entry.word_original || "";

        termRow.appendChild(term);

        if (entry.ipa) {
          const ipa = document.createElement("span");
          ipa.className = "ipa-badge";
          ipa.textContent = entry.ipa;
          termRow.appendChild(ipa);
        }

        textCol.appendChild(termRow);

        if (entry.meaning_original) {
          const definition = document.createElement("div");
          definition.className = "definition";
          definition.textContent = entry.meaning_original;
          textCol.appendChild(definition);
        }

        if (entry.persian_sereh_equivalent) {
          const persian = document.createElement("div");
          persian.className = "source";
          persian.textContent =
            "معادل فارسی: " + entry.persian_sereh_equivalent;
          textCol.appendChild(persian);
        }

        if (entry.pronunciation_source) {
          const source = document.createElement("div");
          source.className = "source";
          source.textContent = "منبع: " + entry.pronunciation_source;
          textCol.appendChild(source);
        }

        const actions = document.createElement("div");
        actions.className = "entry-actions";

        const deleteButton = document.createElement("button");
        deleteButton.type = "button";
        deleteButton.className = "danger small-button";
        deleteButton.textContent = "حذف";

        deleteButton.addEventListener("click", async () => {
          const confirmed = window.confirm(
            `آیا از حذف «${entry.word_original || ""}» مطمئنید؟`
          );

          if (!confirmed) return;

          deleteButton.disabled = true;

          const { error } = await supabase
            .from("word_entries")
            .delete()
            .eq("id", entry.id)
            .eq("user_id", currentUser.id);

          if (error) {
            deleteButton.disabled = false;

            showStatus(
              appStatus,
              "خطا در حذف واژه:\n" + error.message,
              false
            );
            return;
          }

          allEntries = allEntries.filter((item) => item.id !== entry.id);
          renderEntries();
          showStatus(appStatus, "واژه حذف شد.", true);
        });

        actions.appendChild(deleteButton);
        row.appendChild(textCol);
        row.appendChild(actions);
        entriesList.appendChild(row);
      }
    }

    btnLogin.addEventListener("click", async () => {
      clearStatus(loginStatus);

      const email = emailIn.value.trim();
      const password = passwordIn.value;

      if (!email || !password) {
        showStatus(
          loginStatus,
          "لطفاً ایمیل و رمز عبور را وارد کنید.",
          false
        );
        return;
      }

      const stopLoading = setButtonLoading(btnLogin, "در حال ورود…");

      try {
        const { data, error } = await supabase.auth.signInWithPassword({
          email,
          password,
        });

        if (error) {
          throw error;
        }

        currentUser = data.user;
        emailIn.value = "";
        passwordIn.value = "";

        showApp();
        await loadEntries();
      } catch (error) {
        console.error("Login error:", error);

        showStatus(
          loginStatus,
          "خطا در ورود:\n" +
            (error?.message || "ورود انجام نشد."),
          false
        );
      } finally {
        stopLoading();
      }
    });

    btnLogout.addEventListener("click", async () => {
      await supabase.auth.signOut();
      showLogin();
    });

    btnFetchAuto.addEventListener("click", async () => {
      clearStatus(appStatus);

      const word = wordOriginalIn.value.trim();
      const language = languageIdIn.value.trim();

      if (!word) {
        showStatus(
          appStatus,
          "ابتدا واژه را وارد کنید، سپس دکمه‌ی دریافت اطلاعات را بزنید.",
          false
        );
        return;
      }

      clearLookupPanel();

      const stopLoading = setButtonLoading(
        btnFetchAuto,
        "در حال بررسی IPA و منابع…"
      );

      try {
        const { data, error } = await supabase.functions.invoke(
          "fetch-word-data",
          {
            body: { word, language },
          }
        );

        if (error) {
          throw error;
        }

        renderLookupResult(data);

        if (data?.ipa) {
          ipaIn.value = data.ipa;
        }

        if (data?.meaning) {
          meaningOriginalIn.value = data.meaning;
        }

        const sourceName = data?.source || "";
        const sourceUrl = data?.source_url || "";

        if (sourceName || sourceUrl) {
          pronunciationSourceIn.value = sourceUrl
            ? `${sourceName} | ${sourceUrl}`
            : sourceName;
        }

        if (data?.found) {
          const resultLines = [
            "جست‌وجو انجام شد.",
            data.ipa
              ? "IPA در فیلد تلفظ قرار گرفت."
              : "IPA خودکار پیدا نشد؛ منابع پیشنهادی را بررسی کنید.",
            data.meaning
              ? "معنی در فرم قرار گرفت."
              : "معنی قابل استخراج پیدا نشد.",
            "اطلاعات را بررسی و سپس ذخیره کنید.",
          ];

          showStatus(appStatus, resultLines.join("\n"), true);
        } else {
          showStatus(
            appStatus,
            "داده‌ی قابل استخراج خودکار پیدا نشد؛ کارت‌های منابع پژوهشی پایین را باز کنید.",
            false
          );
        }
      } catch (error) {
        console.error("Lookup error:", error);

        showStatus(
          appStatus,
          "خطا در دریافت اطلاعات از منابع:\n" +
            (error?.message || "Edge Function پاسخ نداد."),
          false
        );
      } finally {
        stopLoading();
      }
    });

    btnAdd.addEventListener("click", async () => {
      clearStatus(appStatus);

      if (!currentUser) {
        showStatus(appStatus, "ابتدا وارد حساب کاربری شوید.", false);
        return;
      }

      const word_original = wordOriginalIn.value.trim();
      const ipa = ipaIn.value.trim();
      const persian_sereh_equivalent = persianEquivalentIn.value.trim();
      const meaning_original = meaningOriginalIn.value.trim();
      const pronunciation_source = pronunciationSourceIn.value.trim();

      if (!word_original) {
        showStatus(appStatus, "لطفاً حداقل واژه را وارد کنید.", false);
        return;
      }

      const stopLoading = setButtonLoading(btnAdd, "در حال ذخیره…");

      try {
        /*
          مهم:
          language_id ارسال نمی‌شود، چون در جدول شما INTEGER است.
          کدهای زبانی مثل fa، en، he و… نباید به ستون عددی فرستاده شوند.
        */
        const { data, error } = await supabase
          .from("word_entries")
          .insert({
            user_id: currentUser.id,
            word_original,
            ipa: ipa || null,
            persian_sereh_equivalent: persian_sereh_equivalent || null,
            meaning_original: meaning_original || null,
            pronunciation_source: pronunciation_source || null,
            needs_review: false,
          })
          .select();

        if (error) {
          throw error;
        }

        const newEntry = Array.isArray(data) ? data[0] : null;

        if (newEntry) {
          allEntries.unshift(newEntry);
        } else {
          await loadEntries();
        }

        wordOriginalIn.value = "";
        ipaIn.value = "";
        persianEquivalentIn.value = "";
        meaningOriginalIn.value = "";
        pronunciationSourceIn.value = "";

        clearLookupPanel();
        renderEntries();

        showStatus(appStatus, "واژه با موفقیت ذخیره شد.", true);
      } catch (error) {
        console.error("Insert error:", error);

        showStatus(
          appStatus,
          "خطا در افزودن واژه:\n" +
            (error?.message || "ذخیره‌سازی انجام نشد."),
          false
        );
      } finally {
        stopLoading();
      }
    });

    btnSort.addEventListener("click", () => {
      alphabetical = !alphabetical;

      btnSort.textContent = alphabetical
        ? "نمایش بر اساس زمان"
        : "مرتب‌سازی الفبایی";

      renderEntries();
    });

    searchInput.addEventListener("input", renderEntries);

    wordOriginalIn.addEventListener("input", clearLookupPanel);
    languageIdIn.addEventListener("change", clearLookupPanel);

    supabase.auth.onAuthStateChange((_event, session) => {
      if (!session) {
        showLogin();
      }
    });

    refreshSession();
  </script>
</body>
</html>
