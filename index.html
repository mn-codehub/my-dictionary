<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>واژه‌نامه‌ی من — نسخهٔ دیباگ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg: #f7f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --primary: #2563eb;
      --danger: #dc2626;
      --border: #e5e7eb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Tahoma, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    .container {
      max-width: 720px;
      margin: 24px auto;
      padding: 0 16px;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 20px;
      margin: 0;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .row {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    input, textarea, button {
      font-size: 14px;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
    }
    input, textarea { width: 100%; }
    textarea { min-height: 80px; resize: vertical; }
    button {
      background: var(--primary);
      color: #fff;
      border: none;
      cursor: pointer;
    }
    button.secondary {
      background: #fff;
      color: var(--text);
      border: 1px solid var(--border);
    }
    button.danger {
      background: var(--danger);
    }
    .muted { color: var(--muted); font-size: 13px; }
    .entry {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }
    .entry:last-child { border-bottom: none; }
    .entry-actions {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .hidden { display: none !important; }
    .status {
      font-size: 13px;
      padding: 6px 8px;
      border-radius: 6px;
      margin-top: 8px;
      white-space: pre-wrap;
    }
    .status.ok { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
    .status.err { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
    .debug-bar {
      background: #ffeb3b;
      color: #000;
      padding: 8px;
      border-radius: 6px;
      margin: 10px 0;
      font-size: 14px;
    }
    .log-box {
      background: #111827;
      color: #e5e7eb;
      padding: 10px;
      border-radius: 8px;
      font-family: ui-monospace, SFMono, Menlo, Consolas, monospace;
      font-size: 12px;
      white-space: pre-wrap;
      max-height: 220px;
      overflow: auto;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="debug-bar">
      اگر این نوار زرد را می‌بینی، یعنی کد لود شده است.
    </div>

    <header>
      <h1>واژه‌نامه‌ی من</h1>
      <div id="authBar" class="row">
        <span id="userEmail" class="muted"></span>
        <button id="btnLogout" class="secondary">خروج</button>
      </div>
    </header>

    <!-- فرم ورود -->
    <section id="loginCard" class="card">
      <h2 style="margin:0 0 8px 0; font-size:16px;">ورود</h2>
      <div class="row" style="flex-direction:column; gap:8px;">
        <input id="email" type="email" placeholder="ایمیل" />
        <input id="password" type="password" placeholder="رمز" />
        <button id="btnLogin">ورود</button>
        <div id="loginStatus" class="status hidden"></div>
      </div>
    </section>

    <!-- بخش واژه‌نامه (بعد از ورود نمایش داده می‌شود) -->
    <section id="appCard" class="card hidden">
      <h2 style="margin:0 0 8px 0; font-size:16px;">افزودن واژه</h2>
      <div class="row" style="flex-direction:column; gap:8px;">
        <input id="term" placeholder="واژه" />
        <textarea id="definition" placeholder="معنی / توضیح"></textarea>
        <button id="btnAdd">افزودن</button>
        <div id="appStatus" class="status hidden"></div>
      </div>

      <h2 style="margin:16px 0 8px 0; font-size:16px;">واژه‌های من</h2>
      <div id="entriesList"></div>
    </section>

    <!-- لاگ‌باکس دیباگ -->
    <section class="card">
      <h2 style="margin:0 0 8px 0; font-size:16px;">لاگ‌های دیباگ</h2>
      <div class="muted">هر اتفاقی در جاوااسکریپت بیفتد، اینجا نوشته می‌شود.</div>
      <div id="logBox" class="log-box"></div>
    </section>
  </div>

  <!-- Supabase (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    // ===== تنظیمات =====
    const SUPABASE_URL = "https://bmuwpcqqgxvoghxkaqch.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJtdXdwY3FxZ3h2b2doeGthcWNoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyNDczMzYsImV4cCI6MjEwMjgyMzMzNn0.N-XChiNbcBu3TgdF5S4snZlnyW45RegaAknG2J5EFfM";

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // ===== لاگر ساده =====
    const logBox = document.getElementById("logBox");
    function log(msg, type = "info") {
      const time = new Date().toLocaleTimeString();
      const prefix = type === "error" ? "[ERROR]" : type === "warn" ? "[WARN]" : "[INFO]";
      const line = `${prefix} ${time} — ${msg}\n`;
      logBox.textContent += line;
      logBox.scrollTop = logBox.scrollHeight;
      console.log(line);
    }

    log("شروع اسکریپت…");
    log("Supabase URL: " + SUPABASE_URL);

    // ===== المان‌ها =====
    const loginCard = document.getElementById("loginCard");
    const appCard = document.getElementById("appCard");
    const authBar = document.getElementById("authBar");
    const userEmail = document.getElementById("userEmail");
    const btnLogout = document.getElementById("btnLogout");

    const emailIn = document.getElementById("email");
    const passIn = document.getElementById("password");
    const btnLogin = document.getElementById("btnLogin");
    const loginStatus = document.getElementById("loginStatus");

    const termIn = document.getElementById("term");
    const defIn = document.getElementById("definition");
    const btnAdd = document.getElementById("btnAdd");
    const appStatus = document.getElementById("appStatus");
    const entriesList = document.getElementById("entriesList");

    let currentUser = null;

    // ===== وضعیت‌نما =====
    function showStatus(el, msg, ok) {
      el.textContent = msg;
      el.classList.remove("ok", "err", "hidden");
      el.classList.add(ok ? "ok" : "err");
      setTimeout(() => el.classList.add("hidden"), 8000);
    }

    // ===== Auth =====
    async function refreshSession() {
      try {
        log("در حال بررسی session…");
        const { data: { session }, error } = await supabase.auth.getSession();
        if (error) {
          log("خطا در getSession: " + error.message, "error");
          showLogin();
          return;
        }
        if (!session) {
          log("هیچ session فعالی یافت نشد.", "warn");
          showLogin();
          return;
        }
        currentUser = session.user;
        log("کاربر لاگین‌شده: " + (currentUser?.email || "ناشناس"));
        showApp();
        loadEntries();
      } catch (e) {
        log("خطای کلی در refreshSession: " + (e?.message || e), "error");
        showLogin();
      }
    }

    function showLogin() {
      loginCard.classList.remove("hidden");
      appCard.classList.add("hidden");
      authBar.classList.add("hidden");
      currentUser = null;
    }

    function showApp() {
      loginCard.classList.add("hidden");
      appCard.classList.remove("hidden");
      authBar.classList.remove("hidden");
      userEmail.textContent = currentUser?.email || "";
    }

    btnLogin.addEventListener("click", async () => {
      log("دکمهٔ ورود فشرده شد.");
      loginStatus.classList.add("hidden");
      const email = emailIn.value.trim();
      const password = passIn.value;
      if (!email || !password) {
        const msg = "ایمیل و رمز را وارد کن.";
        log(msg, "warn");
        showStatus(loginStatus, msg, false);
        return;
      }

      log("در حال تلاش برای signInWithPassword با ایمیل: " + email);

      try {
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });

        if (error) {
          const msg = "ورود ناموفق:\n" + error.message;
          log("خطای signInWithPassword: " + error.message, "error");
          showStatus(loginStatus, msg, false);
          return;
        }

        if (!data?.user) {
          const msg = "ورود ناموفق:\nکاربری یافت نشد.";
          log("signInWithPassword: کاربری بازنگشت.", "error");
          showStatus(loginStatus, msg, false);
          return;
        }

        currentUser = data.user;
        log("ورود موفق؛ کاربر: " + currentUser.email);
        showApp();
        loadEntries();
      } catch (e) {
        const msg = "خطا در ورود:\n" + (e?.message || "خطای ناشناخته");
        log("خطای کلی در btnLogin: " + (e?.message || e), "error");
        showStatus(loginStatus, msg, false);
      }
    });

    btnLogout.addEventListener("click", async () => {
      log("دکمهٔ خروج فشرده شد.");
      await supabase.auth.signOut();
      showLogin();
      entriesList.innerHTML = "";
    });

    // ===== CRUD واژه‌ها =====
    async function loadEntries() {
      if (!currentUser) {
        log("loadEntries: کاربری لاگین نیست.", "warn");
        return;
      }
      log("در حال بارگذاری واژه‌ها برای کاربر: " + currentUser.id);
      const { data, error } = await supabase
        .from("entries")
        .select("*")
        .eq("user_id", currentUser.id)
        .order("created_at", { ascending: false });

      if (error) {
        log("خطا در loadEntries: " + error.message, "error");
        showStatus(appStatus, "خطا در بارگذاری:\n" + error.message, false);
        return;
      }
      log("تعداد واژه‌های بارگذاری‌شده: " + (data?.length || 0));
      renderEntries(data || []);
    }

    function renderEntries(rows) {
      entriesList.innerHTML = "";
      if (!rows.length) {
        const empty = document.createElement("div");
        empty.className = "muted";
        empty.textContent = "هنوز واژه‌ای اضافه نکرده‌ای.";
        entriesList.appendChild(empty);
        return;
      }
      rows.forEach(r => {
        const wrap = document.createElement("div");
        wrap.className = "entry";

        const text = document.createElement("div");
        const title = document.createElement("strong");
        title.textContent = r.term || "(بدون عنوان)";
        const desc = document.createElement("div");
        desc.className = "muted";
        desc.textContent = r.definition || "";
        text.appendChild(title);
        text.appendChild(desc);

        const actions = document.createElement("div");
        actions.className = "entry-actions";

        const btnEdit = document.createElement("button");
        btnEdit.className = "secondary";
        btnEdit.textContent = "ویرایش";
        btnEdit.addEventListener("click", () => startEdit(r));

        const btnDel = document.createElement("button");
        btnDel.className = "danger";
        btnDel.textContent = "حذف";
        btnDel.addEventListener("click", () => deleteEntry(r.id));

        actions.appendChild(btnEdit);
        actions.appendChild(btnDel);

        wrap.appendChild(text);
        wrap.appendChild(actions);
        entriesList.appendChild(wrap);
      });
    }

    async function addEntry() {
      if (!currentUser) return;
      const term = termIn.value.trim();
      const definition = defIn.value.trim();
      if (!term && !definition) {
        showStatus(appStatus, "حداقل یکی از فیلدها را پر کن.", false);
        return;
      }
      log("در حال افزودن واژه: " + JSON.stringify({ term, definition }));
      const { error } = await supabase.from("entries").insert({
        user_id: currentUser.id,
        term,
        definition
      });
      if (error) {
        log("خطا در addEntry: " + error.message, "error");
        showStatus(appStatus, "خطا در افزودن:\n" + error.message, false);
        return;
      }
      termIn.value = "";
      defIn.value = "";
      showStatus(appStatus, "واژه اضافه شد.", true);
      loadEntries();
    }

    function startEdit(row) {
      const newTerm = prompt("ویرایش واژه:", row.term || "");
      if (newTerm === null) return;
      const newDef = prompt("ویرایش معنی:", row.definition || "");
      if (newDef === null) return;

      supabase.from("entries").update({ term: newTerm, definition: newDef }).eq("id", row.id).then(({ error }) => {
        if (error) {
          log("خطا در ویرایش: " + error.message, "error");
          showStatus(appStatus, "خطا در ویرایش:\n" + error.message, false);
          return;
        }
        showStatus(appStatus, "ویرایش شد.", true);
        loadEntries();
      });
    }

    async function deleteEntry(id) {
      if (!confirm("آیا مطمئنی؟")) return;
      log("در حال حذف واژه با id: " + id);
      const { error } = await supabase.from("entries").delete().eq("id", id);
      if (error) {
        log("خطا در حذف: " + error.message, "error");
        showStatus(appStatus, "خطا در حذف:\n" + error.message, false);
        return;
      }
      showStatus(appStatus, "حذف شد.", true);
      loadEntries();
    }

    btnAdd.addEventListener("click", addEntry);

    // ===== شروع =====
    log("فراخوانی refreshSession…");
    refreshSession();
  </script>
</body>
</html>
