<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>واژه‌نامه‌ی تخصصی با IPA</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <!-- Android / PWA -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
  <meta name="theme-color" content="#0b1021">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="application-name" content="واژه‌نامه">

  <!-- iPhone / iPad -->
  <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="واژه‌نامه">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    :root {
      --bg: #0b1021;
      --bg-2: #111b3d;
      --card: #121a33;
      --card-2: #0e162d;
      --text: #f3f4f6;
      --muted: #aab2c3;
      --gold-1: #ffd76a;
      --gold-2: #b77912;
      --silver-1: #e7e9ee;
      --silver-2: #778092;
      --red-1: #fb7185;
      --red-2: #a61f35;
      --border: #2a365a;
      --shadow: 0 12px 30px rgba(0, 0, 0, .38);
    }

    * { box-sizing: border-box; }

    html {
      background: var(--bg);
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 0%, #1a2c5d 0%, transparent 35%),
        radial-gradient(circle at 90% 95%, #172952 0%, transparent 35%),
        linear-gradient(145deg, var(--bg) 0%, var(--bg-2) 100%);
      font-family: Tahoma, Arial, system-ui, -apple-system, "Segoe UI", sans-serif;
      line-height: 1.55;
    }

    .container {
      width: min(760px, 100%);
      margin: 0 auto;
      padding: 24px 16px calc(32px + env(safe-area-inset-bottom));
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 6px 2px 16px;
    }

    h1 {
      margin: 0;
      color: var(--gold-1);
      font-size: 22px;
      text-shadow: 0 1px 12px rgba(255, 215, 106, .25);
    }

    h2 {
      margin: 0 0 12px;
      font-size: 17px;
      color: var(--gold-1);
    }

    .card {
      margin-bottom: 16px;
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: linear-gradient(160deg, rgba(22, 34, 67, .98), rgba(11, 18, 38, .98));
      box-shadow: var(--shadow);
    }

    .row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .column {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    input,
    select,
    textarea,
    button {
      width: 100%;
      border-radius: 11px;
      font: inherit;
      font-size: 15px;
    }

    input,
    select,
    textarea {
      border: 1px solid #35436a;
      padding: 11px 12px;
      color: var(--text);
      outline: none;
      background: #091126;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--gold-1);
      box-shadow: 0 0 0 3px rgba(255, 215, 106, .13);
    }

    input::placeholder,
    textarea::placeholder {
      color: #8490a9;
    }

    textarea {
      min-height: 88px;
      resize: vertical;
    }

    button {
      padding: 10px 13px;
      border: 0;
      color: #10131e;
      font-weight: 700;
      cursor: pointer;
      background: linear-gradient(180deg, var(--gold-1), var(--gold-2));
      box-shadow: 0 4px 12px rgba(183, 121, 18, .24);
    }

    button:active {
      transform: translateY(1px);
    }

    button:disabled {
      cursor: wait;
      opacity: .68;
    }

    button.secondary {
      background: linear-gradient(180deg, var(--silver-1), var(--silver-2));
      box-shadow: 0 4px 12px rgba(119, 128, 146, .18);
    }

    button.danger {
      color: #fff;
      background: linear-gradient(180deg, var(--red-1), var(--red-2));
      box-shadow: 0 4px 12px rgba(166, 31, 53, .22);
    }

    .small-button {
      width: auto;
      padding: 7px 10px;
      font-size: 13px;
    }

    .hidden {
      display: none !important;
    }

    .muted {
      color: var(--muted);
      font-size: 13px;
    }

    .status {
      margin-top: 10px;
      padding: 9px 10px;
      border-radius: 10px;
      white-space: pre-wrap;
      font-size: 13px;
    }

    .status.ok {
      color: #b7f7d2;
      border: 1px solid #16865b;
      background: #073b2c;
    }

    .status.err {
      color: #ffd0d5;
      border: 1px solid #b6344a;
      background: #551724;
    }

    .list-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-top: 22px;
    }

    .filters-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 4px 0 10px;
    }

    .search-input {
      margin: 4px 0 10px;
    }

    .entry {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      padding: 13px 0;
      border-bottom: 1px solid rgba(62, 78, 120, .75);
    }

    .entry:last-child {
      border-bottom: 0;
    }

    .term-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .lang-badge {
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 6px;
      border: 1px solid #3a4a75;
      color: #cfd6e6;
      background: #0f1a36;
    }

    .ipa-badge {
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 6px;
      border: 1px solid #4a3a75;
      color: #e6cfd6;
      background: #1a0f36;
      font-family: "Courier New", Courier, monospace;
    }

    .term {
      color: #fff3c5;
      font-size: 16px;
    }

    .definition {
      margin-top: 3px;
      color: var(--muted);
      overflow-wrap: anywhere;
    }

    .source {
      margin-top: 4px;
      font-size: 12px;
      color: #9fb0d6;
      overflow-wrap: anywhere;
    }

    .entry-actions {
      display: flex;
      align-items: flex-start;
      gap: 6px;
    }

    .entry-actions button {
      width: auto;
      padding: 7px 9px;
      font-size: 12px;
    }

    .empty {
      padding: 16px 0 4px;
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 480px) {
      .container { padding-inline: 12px; }
      .card { padding: 15px; border-radius: 15px; }
      .entry { grid-template-columns: 1fr; }
      .entry-actions { justify-content: flex-start; }
      h1 { font-size: 20px; }
      .filters-row { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>
  <main class="container">
    <header>
      <h1>واژه‌نامه‌ی تخصصی</h1>
      <div id="authBar" class="row hidden">
        <span id="userEmail" class="muted"></span>
        <button id="btnLogout" class="secondary small-button" type="button">خروج</button>
      </div>
    </header>

    <section id="loginCard" class="card">
      <h2>ورود به واژه‌نامه</h2>
      <div class="column">
        <input id="email" type="email" inputmode="email" autocomplete="email" placeholder="ایمیل مشترک" />
        <input id="password" type="password" autocomplete="current-password" placeholder="رمز عبور" />
        <button id="btnLogin" type="button">ورود</button>
      </div>
      <div id="loginStatus" class="status hidden"></div>
    </section>

    <section id="appCard" class="card hidden">
      <h2>افزودن واژه</h2>

      <div class="column">
        <input id="wordOriginal" type="text" placeholder="واژه (word_original)" />
        <input id="ipa" type="text" placeholder="تلفظ IPA (اختیاری)" />
        <input id="persianEquivalent" type="text" placeholder="معادل فارسی/سره (اختیاری)" />
        <textarea id="meaningOriginal" placeholder="معنی یا توضیح (meaning_original)"></textarea>
        <input id="pronunciationSource" type="text" placeholder="منبع تلفظ/معنی (اختیاری)" />

        <div class="filters-row">
          <select id="languageId">
            <option value="fa">فارسی (fa)</option>
            <option value="en">انگلیسی (en)</option>
            <option value="de">آلمانی (de)</option>
            <option value="fr">فرانسوی (fr)</option>
            <option value="ar">عربی (ar)</option>
            <option value="tr">ترکی (tr)</option>
          </select>

          <select id="filterLanguageId">
            <option value="">همه‌ی زبان‌ها</option>
            <option value="fa">فارسی (fa)</option>
            <option value="en">انگلیسی (en)</option>
            <option value="de">آلمانی (de)</option>
            <option value="fr">فرانسوی (fr)</option>
            <option value="ar">عربی (ar)</option>
            <option value="tr">ترکی (tr)</option>
          </select>
        </div>

        <button id="btnFetchAuto" class="secondary" type="button">
          دریافت اطلاعات خودکار از Wiktionary
        </button>

        <button id="btnAdd" type="button">افزودن واژه</button>
      </div>

      <div id="appStatus" class="status hidden"></div>

      <div class="list-heading">
        <h2 style="margin:0;">واژه‌ها</h2>
        <button id="btnSort" class="secondary small-button" type="button">مرتب‌سازی الفبایی</button>
      </div>

      <input id="searchInput" class="search-input" type="search" placeholder="جست‌وجو در واژه، IPA، معنی، معادل فارسی، منبع…" />

      <div id="entriesList"></div>
    </section>
  </main>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const SUPABASE_URL = "https://bmuwpcqqgxvoghxkaqch.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJtdXdwY3FxZ3h2b2doeGthcWNoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyNDczMzYsImV4cCI6MjEwMjgyMzMzNn0.N-XChiNbcBu3TgdF5S4snZlnyW45RegaAknG2J5EFfM";

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const loginCard = document.getElementById("loginCard");
    const appCard = document.getElementById("appCard");
    const authBar = document.getElementById("authBar");
    const userEmail = document.getElementById("userEmail");
    const btnLogout = document.getElementById("btnLogout");

    const emailIn = document.getElementById("email");
    const passIn = document.getElementById("password");
    const btnLogin = document.getElementById("btnLogin");
    const loginStatus = document.getElementById("loginStatus");

    const wordOriginalIn = document.getElementById("wordOriginal");
    const ipaIn = document.getElementById("ipa");
    const persianEquivalentIn = document.getElementById("persianEquivalent");
    const meaningOriginalIn = document.getElementById("meaningOriginal");
    const pronunciationSourceIn = document.getElementById("pronunciationSource");
    const languageIdIn = document.getElementById("languageId");

    const btnFetchAuto = document.getElementById("btnFetchAuto");
    const btnAdd = document.getElementById("btnAdd");
    const appStatus = document.getElementById("appStatus");

    const searchInput = document.getElementById("searchInput");
    const btnSort = document.getElementById("btnSort");
    const filterLanguageId = document.getElementById("filterLanguageId");
    const entriesList = document.getElementById("entriesList");

    let currentUser = null;
    let allEntries = [];
    let alphabetical = false;

    /*
      این متغیرها فقط نتیجه‌ی آخرین جست‌وجوی خودکار را تا زمان
      ذخیره‌ی واژه در حافظه‌ی صفحه نگه می‌دارند. با رفرش صفحه پاک می‌شوند.
    */
    let autoLookupData = {
      etymology: "",
      audioUrl: "",
      sourceUrl: "",
      sourceName: "",
      sourcesUsed: [],
    };

    function showStatus(element, message, isOk) {
      element.textContent = message;
      element.className = "status " + (isOk ? "ok" : "err");
      window.setTimeout(() => element.classList.add("hidden"), 7000);
    }

    function resetAutoLookupData() {
      autoLookupData = {
        etymology: "",
        audioUrl: "",
        sourceUrl: "",
        sourceName: "",
        sourcesUsed: [],
      };
    }

    function showLogin() {
      currentUser = null;
      loginCard.classList.remove("hidden");
      appCard.classList.add("hidden");
      authBar.classList.add("hidden");
    }

    function showApp() {
      loginCard.classList.add("hidden");
      appCard.classList.remove("hidden");
      authBar.classList.remove("hidden");
      userEmail.textContent = currentUser?.email || "";
    }

    async function refreshSession() {
      try {
        const { data, error } = await supabase.auth.getSession();

        if (error || !data.session) {
          showLogin();
          return;
        }

        currentUser = data.session.user;
        showApp();
        await loadEntries();
      } catch (error) {
        console.error("refreshSession error:", error);
        showLogin();
      }
    }

    async function loadEntries() {
      if (!currentUser) return;

      const { data, error } = await supabase
        .from("word_entries")
        .select("*")
        .eq("user_id", currentUser.id)
        .order("created_at", { ascending: false });

      if (error) {
        showStatus(appStatus, "خطا در بارگذاری واژه‌ها:\n" + error.message, false);
        return;
      }

      allEntries = data || [];
      renderEntries();
    }

    function renderEntries() {
      const query = (searchInput.value || "").trim().toLowerCase();
      const fLang = (filterLanguageId.value || "").trim();

      let filtered = allEntries;

      if (fLang) {
        filtered = filtered.filter(e => (e.language_id || "") === fLang);
      }

      if (query) {
        filtered = filtered.filter(e => {
          const fields = [
            e.word_original,
            e.ipa,
            e.meaning_original,
            e.persian_sereh_equivalent,
            e.pronunciation_source,
            e.meaning_source,
            e.etymology_root,
            e.language_id,
          ];

          return fields.some(value =>
            String(value || "").toLowerCase().includes(query)
          );
        });
      }

      if (alphabetical) {
        filtered = [...filtered].sort((a, b) =>
          (a.word_original || "").localeCompare(b.word_original || "", "fa")
        );
      }

      entriesList.innerHTML = "";

      if (!filtered.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = query || fLang
          ? "هیچ واژه‌ای با این فیلترها یافت نشد."
          : "هنوز واژه‌ای اضافه نکرده‌اید.";
        entriesList.appendChild(empty);
        return;
      }

      for (const e of filtered) {
        const row = document.createElement("div");
        row.className = "entry";

        const textCol = document.createElement("div");

        const termRow = document.createElement("div");
        termRow.className = "term-row";

        const langBadge = document.createElement("span");
        langBadge.className = "lang-badge";
        langBadge.textContent = e.language_id || "?";

        const termEl = document.createElement("div");
        termEl.className = "term";
        termEl.textContent = e.word_original || "";

        termRow.appendChild(langBadge);
        termRow.appendChild(termEl);

        if (e.ipa) {
          const ipaEl = document.createElement("span");
          ipaEl.className = "ipa-badge";
          ipaEl.textContent = e.ipa;
          termRow.appendChild(ipaEl);
        }

        const defEl = document.createElement("div");
        defEl.className = "definition";
        defEl.textContent = e.meaning_original || "";

        textCol.appendChild(termRow);
        textCol.appendChild(defEl);

        if (e.persian_sereh_equivalent) {
          const peEl = document.createElement("div");
          peEl.className = "source";
          peEl.textContent = "معادل فارسی: " + e.persian_sereh_equivalent;
          textCol.appendChild(peEl);
        }

        if (e.pronunciation_source) {
          const psEl = document.createElement("div");
          psEl.className = "source";
          psEl.textContent = "منبع تلفظ: " + e.pronunciation_source;
          textCol.appendChild(psEl);
        }

        if (e.meaning_source) {
          const msEl = document.createElement("div");
          msEl.className = "source";
          msEl.textContent = "منبع داده: " + e.meaning_source;
          textCol.appendChild(msEl);
        }

        const actionsCol = document.createElement("div");
        actionsCol.className = "entry-actions";

        const btnDelete = document.createElement("button");
        btnDelete.type = "button";
        btnDelete.className = "danger small-button";
        btnDelete.textContent = "حذف";

        btnDelete.addEventListener("click", async () => {
          if (!confirm(`آیا مطمئنید می‌خواهید «${e.word_original}» [${e.language_id}] را حذف کنید؟`)) {
            return;
          }

          const { error } = await supabase
            .from("word_entries")
            .delete()
            .eq("id", e.id)
            .eq("user_id", currentUser.id);

          if (error) {
            showStatus(appStatus, "خطا در حذف واژه:\n" + error.message, false);
            return;
          }

          allEntries = allEntries.filter(x => x.id !== e.id);
          renderEntries();
          showStatus(appStatus, "واژه حذف شد.", true);
        });

        actionsCol.appendChild(btnDelete);
        row.appendChild(textCol);
        row.appendChild(actionsCol);
        entriesList.appendChild(row);
      }
    }

    // ورود
    btnLogin.addEventListener("click", async () => {
      loginStatus.classList.add("hidden");

      const email = emailIn.value.trim();
      const password = passIn.value;

      if (!email || !password) {
        showStatus(loginStatus, "لطفاً ایمیل و رمز عبور را وارد کنید.", false);
        return;
      }

      btnLogin.disabled = true;
      const oldText = btnLogin.textContent;
      btnLogin.textContent = "در حال ورود…";

      try {
        const { data, error } = await supabase.auth.signInWithPassword({
          email,
          password,
        });

        if (error) {
          throw error;
        }

        currentUser = data.user;
        showApp();
        await loadEntries();

        emailIn.value = "";
        passIn.value = "";
      } catch (error) {
        console.error("Login error:", error);
        showStatus(
          loginStatus,
          "خطا در ورود:\n" + (error?.message || "ورود انجام نشد."),
          false
        );
      } finally {
        btnLogin.disabled = false;
        btnLogin.textContent = oldText;
      }
    });

    // خروج
    btnLogout.addEventListener("click", async () => {
      await supabase.auth.signOut();
      resetAutoLookupData();
      showLogin();
    });

    // دریافت اطلاعات خودکار از Edge Function
    btnFetchAuto.addEventListener("click", async () => {
      appStatus.classList.add("hidden");

      const word = wordOriginalIn.value.trim();
      const language = languageIdIn.value.trim();

      if (!word) {
        showStatus(
          appStatus,
          "ابتدا واژه را وارد کنید، سپس دکمه‌ی دریافت اطلاعات خودکار را بزنید.",
          false
        );
        return;
      }

      const oldText = btnFetchAuto.textContent;
      btnFetchAuto.disabled = true;
      btnFetchAuto.textContent = "در حال جست‌وجو در منابع…";

      try {
        const { data, error } = await supabase.functions.invoke(
          "fetch-word-data",
          {
            body: {
              word,
              language,
            },
          }
        );

        if (error) {
          throw error;
        }

        if (!data?.found) {
          resetAutoLookupData();

          const sourceLink = data?.source_url
            ? "\nمنبع بررسی‌شده: " + data.source_url
            : "";

          showStatus(
            appStatus,
            (data?.message || "برای این واژه نتیجه‌ای پیدا نشد.") + sourceLink,
            false
          );
          return;
        }

        if (data.ipa) {
          ipaIn.value = data.ipa;
        }

        if (data.meaning) {
          meaningOriginalIn.value = data.meaning;
        }

        const sourceName = data.source || "Wiktionary";
        const sourceUrl = data.source_url || "";
        const sourceText = sourceUrl
          ? `${sourceName} | ${sourceUrl}`
          : sourceName;

        pronunciationSourceIn.value = sourceText;

        autoLookupData = {
          etymology: data.etymology || "",
          audioUrl: data.audio_url || "",
          sourceUrl,
          sourceName,
          sourcesUsed: Array.isArray(data.sources_used)
            ? data.sources_used
            : [sourceName],
        };

        const resultParts = [
          "اطلاعات موجود از منبع دریافت و در فرم قرار گرفت.",
          data.ipa ? "IPA پیدا شد." : "IPA در نتیجه‌ی منبع نبود.",
          data.meaning ? "معنی/تعریف پیدا شد." : "معنی در نتیجه‌ی منبع نبود.",
          data.audio_url ? "لینک صوتی هم پیدا شد." : "لینک صوتی پیدا نشد.",
          "لطفاً اطلاعات را بررسی کنید و سپس «افزودن واژه» را بزنید.",
        ];

        showStatus(appStatus, resultParts.join("\n"), true);
      } catch (error) {
        console.error("Automatic lookup error:", error);

        showStatus(
          appStatus,
          "خطا در دریافت اطلاعات خودکار:\n" +
            (error?.message || "اتصال به Edge Function برقرار نشد."),
          false
        );
      } finally {
        btnFetchAuto.disabled = false;
        btnFetchAuto.textContent = oldText;
      }
    });

    // افزودن واژه
    btnAdd.addEventListener("click", async () => {
      appStatus.classList.add("hidden");

      if (!currentUser) {
        showStatus(appStatus, "ابتدا وارد حساب کاربری شوید.", false);
        return;
      }

      const word_original = wordOriginalIn.value.trim();
      const ipa = ipaIn.value.trim();
      const persian_sereh_equivalent = persianEquivalentIn.value.trim();
      const meaning_original = meaningOriginalIn.value.trim();
      const pronunciation_source = pronunciationSourceIn.value.trim();
      const language_id = languageIdIn.value.trim();

      if (!word_original) {
        showStatus(appStatus, "لطفاً حداقل «واژه» را وارد کنید.", false);
        return;
      }

      btnAdd.disabled = true;
      const oldText = btnAdd.textContent;
      btnAdd.textContent = "در حال ذخیره…";

      try {
        const { data, error } = await supabase
          .from("word_entries")
          .insert({
            user_id: currentUser.id,
            word_original,
            ipa: ipa || "",
            persian_sereh_equivalent: persian_sereh_equivalent || "",
            meaning_original: meaning_original || "",
            pronunciation_source: pronunciation_source || "",
            language_id,

            transliteration: "",
            pronunciation_link: autoLookupData.sourceUrl || "",
            pronunciation_tradition: "",
            audio_file_url: autoLookupData.audioUrl || "",
            etymology_root: autoLookupData.etymology || "",
            meaning_source: autoLookupData.sourceName || "",
            textual_example: "",
            credibility_level: autoLookupData.sourceName ? "source-retrieved" : "",
            persian_sereh_source: "",
            persian_sereh_status: "",
            research_notes: autoLookupData.sourcesUsed.length
              ? "دریافت خودکار از: " + autoLookupData.sourcesUsed.join(", ")
              : "",
            conflicting_sources: "",
            needs_review: false,
            time_period: "",
          })
          .select();

        if (error) {
          throw error;
        }

        const [newEntry] = data || [];
        if (newEntry) {
          allEntries.unshift(newEntry);
        }

        wordOriginalIn.value = "";
        ipaIn.value = "";
        persianEquivalentIn.value = "";
        meaningOriginalIn.value = "";
        pronunciationSourceIn.value = "";
        resetAutoLookupData();

        renderEntries();
        showStatus(appStatus, "واژه با موفقیت ذخیره شد.", true);
      } catch (error) {
        console.error("Insert error:", error);

        showStatus(
          appStatus,
          "خطا در افزودن واژه:\n" +
            (error?.message || "ذخیره‌سازی انجام نشد."),
          false
        );
      } finally {
        btnAdd.disabled = false;
        btnAdd.textContent = oldText;
      }
    });

    // مرتب‌سازی
    btnSort.addEventListener("click", () => {
      alphabetical = !alphabetical;
      btnSort.textContent = alphabetical
        ? "نمایش بر اساس زمان"
        : "مرتب‌سازی الفبایی";

      renderEntries();
    });

    // جست‌وجو و فیلتر زبان
    searchInput.addEventListener("input", renderEntries);
    filterLanguageId.addEventListener("change", renderEntries);

    refreshSession();
  </script>
</body>
</html>
