<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>واژه‌نامه‌ی من</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <!-- Android / PWA -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
  <meta name="theme-color" content="#0b1021">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="application-name" content="واژه‌نامه">

  <!-- iPhone / iPad -->
  <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="واژه‌نامه">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    :root {
      --bg: #0b1021;
      --bg-2: #111b3d;
      --card: #121a33;
      --card-2: #0e162d;
      --text: #f3f4f6;
      --muted: #aab2c3;
      --gold-1: #ffd76a;
      --gold-2: #b77912;
      --silver-1: #e7e9ee;
      --silver-2: #778092;
      --red-1: #fb7185;
      --red-2: #a61f35;
      --border: #2a365a;
      --shadow: 0 12px 30px rgba(0, 0, 0, .38);
    }

    * { box-sizing: border-box; }

    html {
      background: var(--bg);
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 0%, #1a2c5d 0%, transparent 35%),
        radial-gradient(circle at 90% 95%, #172952 0%, transparent 35%),
        linear-gradient(145deg, var(--bg) 0%, var(--bg-2) 100%);
      font-family: Tahoma, Arial, system-ui, -apple-system, "Segoe UI", sans-serif;
      line-height: 1.55;
    }

    .container {
      width: min(760px, 100%);
      margin: 0 auto;
      padding: 24px 16px calc(32px + env(safe-area-inset-bottom));
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 6px 2px 16px;
    }

    h1 {
      margin: 0;
      color: var(--gold-1);
      font-size: 22px;
      text-shadow: 0 1px 12px rgba(255, 215, 106, .25);
    }

    h2 {
      margin: 0 0 12px;
      font-size: 17px;
      color: var(--gold-1);
    }

    .card {
      margin-bottom: 16px;
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: linear-gradient(160deg, rgba(22, 34, 67, .98), rgba(11, 18, 38, .98));
      box-shadow: var(--shadow);
    }

    .row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .column {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    input,
    textarea,
    button {
      width: 100%;
      border-radius: 11px;
      font: inherit;
      font-size: 15px;
    }

    input,
    textarea {
      border: 1px solid #35436a;
      padding: 11px 12px;
      color: var(--text);
      outline: none;
      background: #091126;
    }

    input:focus,
    textarea:focus {
      border-color: var(--gold-1);
      box-shadow: 0 0 0 3px rgba(255, 215, 106, .13);
    }

    input::placeholder,
    textarea::placeholder {
      color: #8490a9;
    }

    textarea {
      min-height: 88px;
      resize: vertical;
    }

    button {
      padding: 10px 13px;
      border: 0;
      color: #10131e;
      font-weight: 700;
      cursor: pointer;
      background: linear-gradient(180deg, var(--gold-1), var(--gold-2));
      box-shadow: 0 4px 12px rgba(183, 121, 18, .24);
    }

    button:active {
      transform: translateY(1px);
    }

    button.secondary {
      background: linear-gradient(180deg, var(--silver-1), var(--silver-2));
      box-shadow: 0 4px 12px rgba(119, 128, 146, .18);
    }

    button.danger {
      color: #fff;
      background: linear-gradient(180deg, var(--red-1), var(--red-2));
      box-shadow: 0 4px 12px rgba(166, 31, 53, .22);
    }

    .small-button {
      width: auto;
      padding: 7px 10px;
      font-size: 13px;
    }

    .hidden {
      display: none !important;
    }

    .muted {
      color: var(--muted);
      font-size: 13px;
    }

    .status {
      margin-top: 10px;
      padding: 9px 10px;
      border-radius: 10px;
      white-space: pre-wrap;
      font-size: 13px;
    }

    .status.ok {
      color: #b7f7d2;
      border: 1px solid #16865b;
      background: #073b2c;
    }

    .status.err {
      color: #ffd0d5;
      border: 1px solid #b6344a;
      background: #551724;
    }

    .list-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-top: 22px;
    }

    .search-input {
      margin: 4px 0 10px;
    }

    .entry {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      padding: 13px 0;
      border-bottom: 1px solid rgba(62, 78, 120, .75);
    }

    .entry:last-child {
      border-bottom: 0;
    }

    .term {
      color: #fff3c5;
      font-size: 16px;
    }

    .definition {
      margin-top: 3px;
      color: var(--muted);
      overflow-wrap: anywhere;
    }

    .entry-actions {
      display: flex;
      align-items: flex-start;
      gap: 6px;
    }

    .entry-actions button {
      width: auto;
      padding: 7px 9px;
      font-size: 12px;
    }

    .empty {
      padding: 16px 0 4px;
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 480px) {
      .container { padding-inline: 12px; }
      .card { padding: 15px; border-radius: 15px; }
      .entry { grid-template-columns: 1fr; }
      .entry-actions { justify-content: flex-start; }
      h1 { font-size: 20px; }
    }
  </style>
</head>

<body>
  <main class="container">
    <header>
      <h1>واژه‌نامه‌ی من</h1>
      <div id="authBar" class="row hidden">
        <span id="userEmail" class="muted"></span>
        <button id="btnLogout" class="secondary small-button" type="button">خروج</button>
      </div>
    </header>

    <section id="loginCard" class="card">
      <h2>ورود به واژه‌نامه</h2>
      <div class="column">
        <input id="email" type="email" inputmode="email" autocomplete="email" placeholder="ایمیل مشترک" />
        <input id="password" type="password" autocomplete="current-password" placeholder="رمز عبور" />
        <button id="btnLogin" type="button">ورود</button>
      </div>
      <div id="loginStatus" class="status hidden"></div>
    </section>

    <section id="appCard" class="card hidden">
      <h2>افزودن واژه</h2>

      <div class="column">
        <input id="term" type="text" placeholder="واژه" />
        <textarea id="definition" placeholder="معنی یا توضیح"></textarea>
        <button id="btnAdd" type="button">افزودن واژه</button>
      </div>

      <div id="appStatus" class="status hidden"></div>

      <div class="list-heading">
        <h2 style="margin:0;">واژه‌ها</h2>
        <button id="btnSort" class="secondary small-button" type="button">مرتب‌سازی الفبایی</button>
      </div>

      <input id="searchInput" class="search-input" type="search" placeholder="جست‌وجو در واژه یا معنی…" />

      <div id="entriesList"></div>
    </section>
  </main>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const SUPABASE_URL = "https://bmuwpcqqgxvoghxkaqch.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJtdXdwY3FxZ3h2b2doeGthcWNoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyNDczMzYsImV4cCI6MjEwMjgyMzMzNn0.N-XChiNbcBu3TgdF5S4snZlnyW45RegaAknG2J5EFfM";

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const loginCard = document.getElementById("loginCard");
    const appCard = document.getElementById("appCard");
    const authBar = document.getElementById("authBar");
    const userEmail = document.getElementById("userEmail");
    const btnLogout = document.getElementById("btnLogout");

    const emailIn = document.getElementById("email");
    const passIn = document.getElementById("password");
    const btnLogin = document.getElementById("btnLogin");
    const loginStatus = document.getElementById("loginStatus");

    const termIn = document.getElementById("term");
    const definitionIn = document.getElementById("definition");
    const btnAdd = document.getElementById("btnAdd");
    const appStatus = document.getElementById("appStatus");

    const searchInput = document.getElementById("searchInput");
    const btnSort = document.getElementById("btnSort");
    const entriesList = document.getElementById("entriesList");

    let currentUser = null;
    let allEntries = [];
    let alphabetical = false;

    function showStatus(element, message, isOk) {
      element.textContent = message;
      element.className = "status " + (isOk ? "ok" : "err");
      window.setTimeout(() => element.classList.add("hidden"), 7000);
    }

    function showLogin() {
      currentUser = null;
      loginCard.classList.remove("hidden");
      appCard.classList.add("hidden");
      authBar.classList.add("hidden");
    }

    function showApp() {
      loginCard.classList.add("hidden");
      appCard.classList.remove("hidden");
      authBar.classList.remove("hidden");
      userEmail.textContent = currentUser?.email || "";
    }

    async function refreshSession() {
      try {
        const { data, error } = await supabase.auth.getSession();
        if (error || !data.session) {
          showLogin();
          return;
        }

        currentUser = data.session.user;
        showApp();
        await loadEntries();
      } catch {
        showLogin();
      }
    }

    async function loadEntries() {
      if (!currentUser) return;

      const { data, error } = await supabase
        .from("entries")
        .select("*")
        .eq("user_id", currentUser.id)
        .order("created_at", { ascending: false });

      if (error) {
        showStatus(appStatus, "خطا در بارگذاری واژه‌ها:\n" + error.message, false);
        return;
      }

      allEntries = data || [];
      renderFilteredEntries();
    }

    function normalize(text) {
      return (text || "")
        .toString()
        .replace(/ي/g, "ی")
        .replace(/ك/g, "ک")
        .toLocaleLowerCase("fa");
    }

    function getVisibleEntries() {
      const query = normalize(searchInput.value.trim());

      let rows = allEntries.filter((item) => {
        if (!query) return true;
        return normalize(item.term).includes(query) ||
          normalize(item.definition).includes(query);
      });

      if (alphabetical) {
        rows = [...rows].sort((a, b) =>
          normalize(a.term).localeCompare(normalize(b.term), "fa")
        );
      }

      return rows;
    }

    function renderFilteredEntries() {
      const rows = getVisibleEntries();
      entriesList.innerHTML = "";

      if (!rows.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = allEntries.length
          ? "واژه‌ای مطابق جست‌وجوی شما پیدا نشد."
          : "هنوز واژه‌ای وارد نشده است.";
        entriesList.appendChild(empty);
        return;
      }

      rows.forEach((row) => {
        const item = document.createElement("article");
        item.className = "entry";

        const content = document.createElement("div");

        const title = document.createElement("strong");
        title.className = "term";
        title.textContent = row.term || "(بدون واژه)";

        const definition = document.createElement("div");
        definition.className = "definition";
        definition.textContent = row.definition || "";

        content.append(title, definition);

        const actions = document.createElement("div");
        actions.className = "entry-actions";

        const editButton = document.createElement("button");
        editButton.className = "secondary";
        editButton.type = "button";
        editButton.textContent = "ویرایش";
        editButton.addEventListener("click", () => editEntry(row));

        const deleteButton = document.createElement("button");
        deleteButton.className = "danger";
        deleteButton.type = "button";
        deleteButton.textContent = "حذف";
        deleteButton.addEventListener("click", () => deleteEntry(row.id));

        actions.append(editButton, deleteButton);
        item.append(content, actions);
        entriesList.appendChild(item);
      });
    }

    async function addEntry() {
      if (!currentUser) return;

      const term = termIn.value.trim();
      const definition = definitionIn.value.trim();

      if (!term || !definition) {
        showStatus(appStatus, "هم واژه و هم معنی را وارد کن.", false);
        return;
      }

      btnAdd.disabled = true;
      btnAdd.textContent = "در حال افزودن…";

      const { error } = await supabase.from("entries").insert({
        user_id: currentUser.id,
        term,
        definition
      });

      btnAdd.disabled = false;
      btnAdd.textContent = "افزودن واژه";

      if (error) {
        showStatus(appStatus, "خطا در افزودن:\n" + error.message, false);
        return;
      }

      termIn.value = "";
      definitionIn.value = "";
      showStatus(appStatus, "واژه با موفقیت اضافه شد.", true);
      await loadEntries();
      termIn.focus();
    }

    async function editEntry(row) {
      const newTerm = prompt("واژه را ویرایش کن:", row.term || "");
      if (newTerm === null) return;

      const newDefinition = prompt("معنی را ویرایش کن:", row.definition || "");
      if (newDefinition === null) return;

      const { error } = await supabase
        .from("entries")
        .update({
          term: newTerm.trim(),
          definition: newDefinition.trim()
        })
        .eq("id", row.id)
        .eq("user_id", currentUser.id);

      if (error) {
        showStatus(appStatus, "خطا در ویرایش:\n" + error.message, false);
        return;
      }

      showStatus(appStatus, "واژه ویرایش شد.", true);
      await loadEntries();
    }

    async function deleteEntry(id) {
      if (!confirm("این واژه حذف شود؟")) return;

      const { error } = await supabase
        .from("entries")
        .delete()
        .eq("id", id)
        .eq("user_id", currentUser.id);

      if (error) {
        showStatus(appStatus, "خطا در حذف:\n" + error.message, false);
        return;
      }

      showStatus(appStatus, "واژه حذف شد.", true);
      await loadEntries();
    }

    btnLogin.addEventListener("click", async () => {
      const email = emailIn.value.trim();
      const password = passIn.value;

      if (!email || !password) {
        showStatus(loginStatus, "ایمیل و رمز را وارد کن.", false);
        return;
      }

      btnLogin.disabled = true;
      btnLogin.textContent = "در حال ورود…";

      const { data, error } = await supabase.auth.signInWithPassword({
        email,
        password
      });

      btnLogin.disabled = false;
      btnLogin.textContent = "ورود";

      if (error || !data.user) {
        showStatus(loginStatus, "ورود ناموفق:\n" + (error?.message || "خطای ناشناخته"), false);
        return;
      }

      currentUser = data.user;
      showApp();
      await loadEntries();
    });

    btnLogout.addEventListener("click", async () => {
      await supabase.auth.signOut();
      allEntries = [];
      entriesList.innerHTML = "";
      showLogin();
    });

    btnAdd.addEventListener("click", addEntry);

    searchInput.addEventListener("input", renderFilteredEntries);

    btnSort.addEventListener("click", () => {
      alphabetical = !alphabetical;
      btnSort.textContent = alphabetical
        ? "نمایش بر اساس جدیدترین"
        : "مرتب‌سازی الفبایی";
      renderFilteredEntries();
    });

    passIn.addEventListener("keydown", (event) => {
      if (event.key === "Enter") btnLogin.click();
    });

    definitionIn.addEventListener("keydown", (event) => {
      if (event.ctrlKey && event.key === "Enter") addEntry();
    });

    refreshSession();
  </script>
</body>
</html>
